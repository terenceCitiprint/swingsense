[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swingsense"
version = "0.1.0"
description = "Bridge what your golf swing FEELS like and what's actually happening — feel-to-mechanics translation grounded in physics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
vision = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "mediapipe>=0.10.14",
    "plotly>=5.20",
]

[project.scripts]
swingsense = "swingsense.cli:app"

[tool.setuptools.packages.find]
include = ["swingsense*"]

[tool.setuptools.package-data]
swingsense = ["kb/**/*.yaml"]
