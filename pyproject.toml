[project]
name = "swingsense"
version = "0.1.0"
description = "Bridge the gap between what a golf swing feels like and what is actually happening."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
swingsense = "swingsense.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swingsense"]
